[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatsync"
version = "0.1.0"
description = "텍스트파일에 추가되는 채팅 로그 중 미전송분만 서버(DB)로 전송"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
client = [
    "httpx>=0.27",
    "watchdog>=4.0",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "SQLAlchemy>=2.0",
]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
dev = [
    "chatsync[client,server]",
    "pytest>=8",
]

[project.scripts]
chatsync-client = "chatsync.client.__main__:main"
chatsync-server = "chatsync.server.__main__:main"

[tool.setuptools.packages.find]
include = ["chatsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
